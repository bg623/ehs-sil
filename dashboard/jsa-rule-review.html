<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>工作安全分析（JSA）专业规则审核 · EHS-SIL</title>
<style>
:root{
    --text:#263238;--background:#f7f4ee;--surface:#fff;--primary:#123b4a;
    --primary-dark:#082630;--secondary:#dce9e7;--accent:#96630b;
    --border:#d7d2c8;--muted:#667176;--danger:#9f2f2f;--success:#21633e;
    --warning:#815b0d;--shadow:0 12px 34px rgba(8,38,48,.08);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--text);font-family:var(--font);line-height:1.65}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1160px,calc(100% - 2rem));margin:0 auto}
.header{background:var(--primary-dark);color:#fff;padding:2rem 0 2.4rem}
.header a{color:#f0c879;text-decoration:none;font-size:.82rem}
.header h1{font-size:clamp(1.65rem,4vw,2.35rem);margin:.45rem 0 .25rem}
.header p{margin:0;color:rgba(255,255,255,.72);font-size:.92rem}
.notice{background:#fff8df;border:1px solid #e3c76d;border-radius:12px;padding:1rem 1.15rem;margin:1.25rem 0;color:#5d4814;font-size:.86rem}
.notice strong{color:#49370d}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(247,244,238,.96);backdrop-filter:blur(10px);padding:.8rem 0;border-bottom:1px solid var(--border)}
.toolbar-grid{display:grid;grid-template-columns:1fr 1fr auto auto;gap:.7rem;align-items:end}
.field label{display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:.2rem}
.field input,.field select,.field textarea{
    width:100%;border:1px solid var(--border);background:#fff;color:var(--text);
    border-radius:8px;padding:.62rem .72rem
}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid rgba(18,59,74,.14);border-color:var(--primary)}
.btn{border:0;border-radius:8px;padding:.65rem .95rem;font-weight:700;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--secondary);color:var(--primary-dark)}
.btn-quiet{background:#fff;color:var(--primary);border:1px solid var(--border)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;margin:1.2rem 0}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem}
.stat strong{display:block;font-size:1.4rem;color:var(--primary)}
.stat span{font-size:.76rem;color:var(--muted)}
.progress{height:7px;background:#e4dfd6;border-radius:999px;overflow:hidden;margin-top:.55rem}
.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.filters{display:grid;grid-template-columns:1fr 220px;gap:.7rem;margin-bottom:1rem}
.rules{display:grid;gap:1rem;padding-bottom:2rem}
.rule-card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.rule-head{display:flex;justify-content:space-between;gap:1rem;padding:1rem 1.15rem;background:#fbfaf7;border-bottom:1px solid var(--border)}
.rule-id{font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.rule-title{margin:.12rem 0 0;color:var(--primary-dark);font-size:1.06rem}
.severity{align-self:center;border-radius:999px;padding:.2rem .6rem;font-size:.7rem;font-weight:800}
.severity-high{background:#fbe3df;color:#8e2f26}.severity-medium{background:#fff0ca;color:#71520c}.severity-low{background:#dff2e7;color:#1f603c}
.rule-body{padding:1.1rem 1.15rem}
.rule-details{display:grid;grid-template-columns:1fr 1fr;gap:.75rem 1rem;margin-bottom:1rem}
.detail{border-left:3px solid var(--secondary);padding-left:.65rem}
.detail.wide{grid-column:1/-1}
.detail dt{font-size:.7rem;font-weight:800;color:var(--muted);margin-bottom:.1rem}
.detail dd{margin:0;font-size:.83rem}
.review-box{background:#f3f7f6;border:1px solid #cadbd8;border-radius:10px;padding:1rem}
.decision-group{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-bottom:.85rem}
.decision{position:relative}
.decision input{position:absolute;opacity:0;pointer-events:none}
.decision span{display:block;text-align:center;background:#fff;border:1px solid var(--border);border-radius:7px;padding:.48rem .35rem;font-size:.76rem;font-weight:700}
.decision input:checked+span{background:var(--primary);border-color:var(--primary);color:#fff}
.review-fields{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.review-fields .source{grid-column:1/-1}
.review-fields .comments{grid-column:1/-1}
.review-fields textarea{min-height:78px;resize:vertical}
.verified-sources{grid-column:1/-1;background:#fff;border:1px solid var(--border);border-radius:8px;padding:.75rem}
.verified-sources h3{font-size:.76rem;color:var(--primary-dark);margin:0 0 .55rem}
.source-list{display:grid;gap:.55rem}
.source-item{border-left:3px solid var(--secondary);padding-left:.65rem;font-size:.76rem}
.source-item strong{display:block;color:var(--text)}
.source-item span{display:block;color:var(--muted)}
.source-item a{color:var(--primary);font-weight:700;text-decoration-thickness:1px;text-underline-offset:2px}
.source-warning{color:var(--warning)!important;margin-top:.15rem}
.validation{display:none;color:var(--danger);font-size:.75rem;margin-top:.6rem;font-weight:700}
.validation.show{display:block}
.empty{display:none;text-align:center;padding:3rem 1rem;color:var(--muted)}
.footer-actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;padding:1rem 0 2.5rem}
.status-message{position:fixed;right:1rem;bottom:1rem;max-width:360px;padding:.8rem 1rem;border-radius:9px;background:var(--primary-dark);color:#fff;box-shadow:var(--shadow);font-size:.8rem;display:none;z-index:30}
.status-message.show{display:block}
.status-message.error{background:var(--danger)}
@media(max-width:820px){
    .toolbar-grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(2,1fr)}
    .summary .stat:first-child{grid-column:1/-1}.rule-details,.review-fields{grid-template-columns:1fr}
    .review-fields .comments,.detail.wide{grid-column:auto}.decision-group{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
    .toolbar-grid,.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}
    .rule-head{align-items:flex-start}.footer-actions{justify-content:stretch}.footer-actions .btn{width:100%}
}
@media print{
    .toolbar,.filters,.footer-actions,.notice,.status-message{display:none!important}
    body{background:#fff}.header{background:#fff;color:#000;padding:0 0 1rem}.header a{display:none}.header p{color:#555}
    .rule-card{box-shadow:none;break-inside:avoid}.rules{gap:.6rem}.review-box{background:#fff}
}
</style>
</head>
<body>
<header class="header">
<div class="container">
<a href="admin.html">&larr; 返回工作台</a>
<h1>工作安全分析（JSA）专业规则审核</h1>
<p>逐条确认专业含义，形成可追溯的产品负责人审核记录</p>
</div>
</header>

<main>
<div class="container">
<div class="notice">
<strong>安全边界：</strong>专业来源已通过官方发布页面核对，但仍需产品负责人确认其适用范围。核对来源不等于认定法规适用、作业合规或风险可接受。本页面不会直接修改线上规则；审核草稿仅保存在当前浏览器，导出后仍需黄金案例和回归测试。
</div>
</div>

<div class="toolbar">
<div class="container toolbar-grid">
<div class="field">
<label for="reviewer">审核人</label>
<input id="reviewer" autocomplete="name" placeholder="例如：John Yu">
</div>
<div class="field">
<label for="reviewDate">审核日期</label>
<input id="reviewDate" type="date">
</div>
<button class="btn btn-secondary" id="saveButton" type="button">保存草稿</button>
<button class="btn btn-primary" id="exportButton" type="button">下载审核结果</button>
</div>
</div>

<div class="container">
<section class="summary" aria-label="审核进度">
<div class="stat"><strong id="reviewProgress">0%</strong><span>审核完成度</span><div class="progress"><span id="progressBar"></span></div></div>
<div class="stat"><strong id="approvedCount">0</strong><span>批准进入内部测试</span></div>
<div class="stat"><strong id="revisionCount">0</strong><span>需要修改</span></div>
<div class="stat"><strong id="rejectedCount">0</strong><span>拒绝</span></div>
<div class="stat"><strong id="pendingCount">0</strong><span>待审核</span></div>
</section>

<section class="filters" aria-label="筛选规则">
<div class="field"><label for="searchInput">搜索规则</label><input id="searchInput" type="search" placeholder="输入名称、编号、风险类别或提示内容"></div>
<div class="field"><label for="statusFilter">审核状态</label><select id="statusFilter">
<option value="all">全部状态</option>
<option value="pending">待审核</option>
<option value="approved">批准</option>
<option value="needs_revision">需要修改</option>
<option value="rejected">拒绝</option>
</select></div>
</section>

<section id="rules" class="rules" aria-live="polite"></section>
<div id="emptyState" class="empty">没有符合当前筛选条件的规则。</div>

<div class="footer-actions">
<button class="btn btn-quiet" id="importButton" type="button">导入已有审核结果</button>
<input id="importInput" type="file" accept="application/json,.json" hidden>
<button class="btn btn-quiet" id="printButton" type="button">打印审核清单</button>
<button class="btn btn-primary" id="exportBottomButton" type="button">下载审核结果</button>
</div>
</div>
</main>

<div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

<script src="../js/jsa-review.js"></script>
<script>
(function () {
    'use strict';

    var STORAGE_PREFIX = 'ehs_sil_jsa_review_';
    var ruleset = null;
    var sourceCatalog = {};
    var state = null;
    var rulesById = {};
    var labels = {
        pending: '待审核',
        approved: '批准',
        needs_revision: '需要修改',
        rejected: '拒绝'
    };
    var scenarioLabels = {
        all: '所有场景（All Scenarios）', maintenance: '检维修（Maintenance）',
        equipment_opening: '设备打开（Equipment Opening）',
        electrical_work: '电气作业（Electrical Work）',
        chemical_handling: '化学品操作（Chemical Handling）',
        hot_work: '动火作业（Hot Work）',
        confined_space: '受限空间（Confined Space）',
        work_at_height: '高处作业（Work at Height）',
        lifting: '吊装作业（Lifting）'
    };

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function safeSourceUrl(value) {
        try {
            var url = new URL(String(value || ''));
            return url.protocol === 'https:' ? url.href : '';
        } catch (error) {
            return '';
        }
    }

    function storageKey() {
        return STORAGE_PREFIX + ruleset.ruleset_version;
    }

    function showMessage(message, isError) {
        var element = document.getElementById('statusMessage');
        element.textContent = message;
        element.className = 'status-message show' + (isError ? ' error' : '');
        clearTimeout(showMessage.timer);
        showMessage.timer = setTimeout(function () { element.className = 'status-message'; }, 4200);
    }

    function getReview(ruleId) {
        return state.reviews.find(function (review) { return review.rule_id === ruleId; });
    }

    function syncMetadata() {
        state.reviewer = document.getElementById('reviewer').value.trim();
        state.review_date = document.getElementById('reviewDate').value;
    }

    function saveDraft(showConfirmation) {
        syncMetadata();
        localStorage.setItem(storageKey(), JSON.stringify(state));
        if (showConfirmation) showMessage('审核草稿已保存在当前浏览器');
    }

    function updateSummary() {
        var summary = EhsSilJsaReview.summarize(state.reviews);
        var reviewed = state.reviews.length - summary.pending;
        var progress = state.reviews.length ? Math.round(reviewed / state.reviews.length * 100) : 0;
        document.getElementById('reviewProgress').textContent = progress + '%';
        document.getElementById('progressBar').style.width = progress + '%';
        document.getElementById('approvedCount').textContent = summary.approved;
        document.getElementById('revisionCount').textContent = summary.needs_revision;
        document.getElementById('rejectedCount').textContent = summary.rejected;
        document.getElementById('pendingCount').textContent = summary.pending;
    }

    function decisionMarkup(ruleId, current) {
        return ['pending', 'approved', 'needs_revision', 'rejected'].map(function (decision) {
            return '<label class="decision"><input type="radio" name="decision-' + escapeHtml(ruleId) +
                '" value="' + decision + '"' + (current === decision ? ' checked' : '') +
                '><span>' + labels[decision] + '</span></label>';
        }).join('');
    }

    function sourceMarkup(rule) {
        var refs = Array.isArray(rule.source_refs) ? rule.source_refs : [];
        if (!refs.length) {
            return '<div class="source-item"><strong>尚未关联已核实来源</strong>' +
                '<span class="source-warning">批准前需要补充可追溯来源。</span></div>';
        }
        return refs.map(function (sourceId) {
            var source = sourceCatalog[sourceId];
            if (!source) {
                return '<div class="source-item"><strong>' + escapeHtml(sourceId) +
                    '</strong><span class="source-warning">来源目录中未找到该记录。</span></div>';
            }
            var url = safeSourceUrl(source.url);
            var title = source.title_zh + '（' + source.title_en + '）';
            var links = [];
            if (url) {
                links.push('<a href="' + escapeHtml(url) +
                    '" target="_blank" rel="noopener noreferrer">查看官方来源</a>');
            }
            (source.related_urls || []).forEach(function (item) {
                var relatedUrl = safeSourceUrl(item.url);
                if (relatedUrl) {
                    links.push('<a href="' + escapeHtml(relatedUrl) +
                        '" target="_blank" rel="noopener noreferrer">' +
                        escapeHtml(item.label_zh + '（' + item.label_en + '）') + '</a>');
                }
            });
            return '<div class="source-item"><strong>' + escapeHtml(source.reference) + ' · ' +
                escapeHtml(title) + '</strong><span>' + escapeHtml(source.scope_note) + '</span>' +
                links.join(' · ') + '</div>';
        }).join('');
    }

    function renderRule(rule) {
        var review = getReview(rule.rule_id);
        var scenarios = (rule.applicable_scenario || []).map(function (scenario) {
            return scenarioLabels[scenario] || scenario;
        }).join('、');
        var severityLabel = rule.severity === 'high' ? '高关注' : rule.severity === 'medium' ? '中关注' : '一般';

        return '<article class="rule-card" data-rule-id="' + escapeHtml(rule.rule_id) + '">' +
            '<div class="rule-head"><div><div class="rule-id">' + escapeHtml(rule.rule_id) +
            ' · 版本 ' + escapeHtml(rule.version) + '</div><h2 class="rule-title">' +
            escapeHtml(rule.rule_name) + '</h2></div><span class="severity severity-' +
            escapeHtml(rule.severity) + '">' + severityLabel + '</span></div>' +
            '<div class="rule-body"><dl class="rule-details">' +
            '<div class="detail"><dt>适用场景</dt><dd>' + escapeHtml(scenarios) + '</dd></div>' +
            '<div class="detail"><dt>触发条件</dt><dd>' + escapeHtml(EhsSilJsaReview.describeTrigger(rule.trigger_condition)) + '</dd></div>' +
            '<div class="detail wide"><dt>给用户的风险提示</dt><dd>' + escapeHtml(rule.prompt_text) + '</dd></div>' +
            '<div class="detail"><dt>提示原因</dt><dd>' + escapeHtml(rule.reason) + '</dd></div>' +
            '<div class="detail"><dt>建议行动</dt><dd>' + escapeHtml(rule.recommended_action) + '</dd></div>' +
            '</dl><div class="review-box"><div class="decision-group">' +
            decisionMarkup(rule.rule_id, review.decision) + '</div><div class="review-fields">' +
            '<div class="verified-sources"><h3>已核实的专业来源或参考标准</h3><div class="source-list">' +
            sourceMarkup(rule) + '</div></div>' +
            '<div class="field source"><label for="source-' + escapeHtml(rule.rule_id) +
            '">审核采用的专业来源或参考标准</label>' +
            '<textarea id="source-' + escapeHtml(rule.rule_id) +
            '" class="source-input" placeholder="批准前必须确认可追溯来源">' +
            escapeHtml(review.source) + '</textarea></div>' +
            '<div class="field comments"><label for="comments-' + escapeHtml(rule.rule_id) +
            '">审核意见</label><textarea id="comments-' + escapeHtml(rule.rule_id) +
            '" class="comments-input" placeholder="需要修改或拒绝时必须说明原因">' +
            escapeHtml(review.comments) + '</textarea></div></div>' +
            '<div class="validation" role="alert"></div></div></div></article>';
    }

    function render() {
        var search = document.getElementById('searchInput').value.trim().toLowerCase();
        var status = document.getElementById('statusFilter').value;
        var visibleRules = ruleset.rules.filter(function (rule) {
            var review = getReview(rule.rule_id);
            var haystack = [
                rule.rule_id, rule.rule_name, rule.risk_category, rule.prompt_text,
                rule.reason, rule.recommended_action
            ].join(' ').toLowerCase();
            return (!search || haystack.indexOf(search) >= 0) &&
                (status === 'all' || review.decision === status);
        });

        document.getElementById('rules').innerHTML = visibleRules.map(renderRule).join('');
        document.getElementById('emptyState').style.display = visibleRules.length ? 'none' : 'block';
        bindRuleEvents();
        updateSummary();
    }

    function validateCard(ruleId) {
        syncMetadata();
        var review = getReview(ruleId);
        var errors = EhsSilJsaReview.validateReview(
            review,
            state,
            new Set(ruleset.rules.map(function (rule) { return rule.rule_id; }))
        );
        var card = document.querySelector('[data-rule-id="' + ruleId + '"]');
        if (card) {
            var validation = card.querySelector('.validation');
            validation.textContent = errors.join('；');
            validation.className = 'validation' + (errors.length ? ' show' : '');
        }
        return errors;
    }

    function bindRuleEvents() {
        document.querySelectorAll('.rule-card').forEach(function (card) {
            var ruleId = card.getAttribute('data-rule-id');
            card.querySelectorAll('input[type="radio"]').forEach(function (input) {
                input.addEventListener('change', function () {
                    getReview(ruleId).decision = input.value;
                    validateCard(ruleId);
                    saveDraft(false);
                    updateSummary();
                });
            });
            card.querySelector('.source-input').addEventListener('input', function (event) {
                getReview(ruleId).source = event.target.value;
                validateCard(ruleId);
                saveDraft(false);
            });
            card.querySelector('.comments-input').addEventListener('input', function (event) {
                getReview(ruleId).comments = event.target.value;
                validateCard(ruleId);
                saveDraft(false);
            });
        });
    }

    function exportReview() {
        syncMetadata();
        var payload;
        try {
            payload = EhsSilJsaReview.buildExport(ruleset, state);
        } catch (error) {
            showMessage((error.validationErrors || [error.message]).join('；'), true);
            state.reviews.forEach(function (review) { validateCard(review.rule_id); });
            return;
        }
        saveDraft(false);
        var blob = new Blob([JSON.stringify(payload, null, 2) + '\n'], {type: 'application/json'});
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '工作安全分析JSA专业规则审核结果-' + (state.review_date || new Date().toISOString().slice(0, 10)) + '.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        showMessage('结构化审核结果（JSON）已下载，请交给 Codex 导入并执行测试');
    }

    function importReview(file) {
        var reader = new FileReader();
        reader.onload = function () {
            try {
                var imported = JSON.parse(reader.result);
                if (imported.export_type !== 'jsa_product_owner_review') throw new Error('文件类型不正确');
                if (imported.ruleset_version !== ruleset.ruleset_version) throw new Error('规则库版本不一致');
                state = EhsSilJsaReview.createReviewState(ruleset, imported);
                document.getElementById('reviewer').value = state.reviewer;
                document.getElementById('reviewDate').value = state.review_date;
                saveDraft(false);
                render();
                showMessage('审核结果已导入');
            } catch (error) {
                showMessage('导入失败：' + error.message, true);
            }
        };
        reader.readAsText(file);
    }

    function initialize(data) {
        ruleset = data.ruleset;
        sourceCatalog = data.sourceCatalog.sources || {};
        ruleset.rules.forEach(function (rule) { rulesById[rule.rule_id] = rule; });
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem(STORAGE_PREFIX + ruleset.ruleset_version)); } catch (error) {}
        state = EhsSilJsaReview.createReviewState(ruleset, saved);
        document.getElementById('reviewer').value = state.reviewer;
        document.getElementById('reviewDate').value = state.review_date || new Date().toISOString().slice(0, 10);
        if (!state.review_date) state.review_date = document.getElementById('reviewDate').value;
        render();
    }

    document.getElementById('saveButton').addEventListener('click', function () { saveDraft(true); });
    document.getElementById('exportButton').addEventListener('click', exportReview);
    document.getElementById('exportBottomButton').addEventListener('click', exportReview);
    document.getElementById('printButton').addEventListener('click', function () { window.print(); });
    document.getElementById('importButton').addEventListener('click', function () {
        document.getElementById('importInput').click();
    });
    document.getElementById('importInput').addEventListener('change', function (event) {
        if (event.target.files[0]) importReview(event.target.files[0]);
        event.target.value = '';
    });
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('reviewer').addEventListener('input', function () { syncMetadata(); saveDraft(false); });
    document.getElementById('reviewDate').addEventListener('change', function () { syncMetadata(); saveDraft(false); });

    Promise.all([
        fetch('../data/jsa-rules.json', {cache: 'no-store'}),
        fetch('../data/jsa-source-catalog.json', {cache: 'no-store'})
    ])
        .then(function (responses) {
            if (!responses[0].ok) throw new Error('规则库加载失败');
            if (!responses[1].ok) throw new Error('专业来源目录加载失败');
            return Promise.all(responses.map(function (response) { return response.json(); }));
        })
        .then(function (data) {
            return {ruleset: data[0], sourceCatalog: data[1]};
        })
        .then(initialize)
        .catch(function (error) {
            document.getElementById('rules').innerHTML =
                '<div class="notice"><strong>无法打开审核页：</strong>' + escapeHtml(error.message) +
                '。请通过网站或本地HTTP服务访问，不要直接双击HTML文件。</div>';
        });
}());
</script>
</body>
</html>
