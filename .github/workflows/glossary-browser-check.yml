name: Glossary browser check

on:
  pull_request:
    paths:
      - 'tools/ehs-glossary.html'
      - 'css/ehs-glossary.css'
      - 'js/ehs-glossary.js'
      - 'assets/data/ehs-glossary.json'
      - 'assets/downloads/ehs-sil-ehs-glossary-445.xlsx'
      - 'tests/ehs-glossary.browser.spec.mjs'
      - '.github/workflows/glossary-browser-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ehs-glossary-http.log 2>&1 &
      - name: Run browser acceptance tests
        run: npx playwright test tests/ehs-glossary.browser.spec.mjs --reporter=line
        env:
          GLOSSARY_BASE_URL: http://127.0.0.1:8765/tools/ehs-glossary.html
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ehs-glossary-screenshots
          path: test-results/glossary-screenshots/
          if-no-files-found: warn
