name: Scenario workbench browser checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix build/scenario
      - run: npm run build --prefix build/scenario
      - run: node scripts/validate-scenario-data.mjs && node --test tests/scenario-*.test.mjs
      - run: ./build/scenario/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8785 --bind 127.0.0.1 &
          node tests/scenario-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-qa
          path: test-results/scenario
