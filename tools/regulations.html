<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.container{max-width:1000px;margin:0 auto;padding:0 1.5rem}
.header{background:var(--primary-dark);color:#fff;padding:2rem 0 3rem;text-align:center}

.search-box input{width:100%;padding:.7rem 1rem .7rem 2.5rem;border:2px solid transparent;border-radius:8px;font-size:.9rem;background:rgba(255,255,255,.12);color:#fff;outline:none;transition:.3s}

.count{font-size:.78rem;color:var(--text-muted);text-align:center;padding:.5rem}
.compliance-cta{margin:1rem 0 .2rem;padding:1.15rem 1.25rem;background:linear-gradient(135deg,#fff 0%,#fffaf0 100%);border:1px solid #d8c38b;border-left:5px solid var(--accent);border-radius:12px;display:flex;gap:1rem;align-items:center;box-shadow:0 8px 24px rgba(7,29,39,.08)}
.compliance-cta-icon{width:54px;height:54px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:1.75rem;line-height:1;flex:0 0 auto;box-shadow:0 6px 14px rgba(13,40,54,.2)}
.compliance-cta-copy{flex:1;min-width:220px}
.compliance-cta-kicker{display:inline-block;margin-bottom:.25rem;color:#8a6000;font-size:.68rem;font-weight:700;letter-spacing:.08em}
.compliance-cta-copy strong{display:block;color:var(--primary-dark);font-size:1rem;line-height:1.35}
.compliance-cta-copy p{font-size:.8rem;color:var(--text-secondary);margin-top:.3rem;line-height:1.5}
.compliance-cta-btn{min-height:48px;padding:.75rem 1.05rem;border-radius:9px;background:linear-gradient(135deg,#c79212,#9a6b05);color:#fff;text-decoration:none;font-size:.86rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;white-space:nowrap;box-shadow:0 7px 16px rgba(154,107,5,.25);transition:transform .2s,box-shadow .2s,filter .2s}
.compliance-cta-btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(154,107,5,.32);filter:saturate(1.08)}
.compliance-cta-btn:focus-visible{outline:3px solid rgba(184,134,11,.3);outline-offset:3px}
.compliance-cta-arrow{width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1rem}

            .item{position:relative}

<body>
<div class="header"><div class="container">
<a href="../index.html" class="back">&larr; 返回首页</a>
<h1>&#128214; EHS法规导航</h1>
<p>中国与国际EHS法规、标准和官方来源导航</p>
<div class="search-box">
<span class="search-icon">&#128269;</span>
<input type="text" id="searchInput" placeholder="搜索法规名称、编号、关键词..." oninput="filterRegs()">
</div>
</div></div>

<div class="container">
<div class="compliance-cta">
  <div class="compliance-cta-icon" aria-hidden="true">🏭</div>
  <div class="compliance-cta-copy"><span class="compliance-cta-kicker">免费在线工具</span><strong>不知道哪些法规适用于你的企业？</strong><p>法规速查适合已知名称时搜索；智能识别根据企业画像生成初步适用清单。</p></div>
  <a href="compliance-identification.html" class="compliance-cta-btn" aria-label="立即进行企业适用法规智能识别"><span>立即进行智能识别</span><span class="compliance-cta-arrow" aria-hidden="true">→</span></a>
</div>
<div class="tabs" id="tabs">
<button class="tab active" onclick="setTab('all',this)">全部</button>
<button class="tab" onclick="setTab('中国',this)">&#128205; 中国法规</button>
<button class="tab" onclick="setTab('美国',this)">美国</button>
<button class="tab" onclick="setTab('欧盟',this)">欧盟</button>
<button class="tab" onclick="setTab('英国',this)">英国</button>
<button class="tab" onclick="setTab('国际标准',this)">&#127758; 国际标准/指南</button>
</div>
<div class="source-note">法规优先链接官方原文；ISO、IEC、NFPA、API、GB/T等版权标准仅提供官方阅读或购买入口，本站不托管未经授权的标准PDF。</div>
<div class="count" id="count"></div>
<div style="text-align:center;margin-bottom:.6rem">
    <button class="tab" onclick="exportCSV()">&#128203; 批量导出当前筛选</button>
    <button class="tab" onclick="exportCSV(true)" style="margin-left:.3rem">&#128230; 导出全部</button>
</div>
<div class="list" id="list"></div>
</div>

<script>
var data = [];
fetch('../data/regulations.json?v=20260813').then(function(r){return r.json()}).then(function(d){
    data = d.regulations;
    render();
    document.getElementById('count').textContent = data.length + ' 条法规标准';
});

var currentTab = 'all';
var currentQuery = '';
var regulationAnalyticsTimer;
var lastTrackedRegulationSearch = '';

function resultBucket(count){
    if(count === 0) return '0';
    if(count <= 10) return '1-10';
    if(count <= 50) return '11-50';
    return '51+';
}

function queryCategoryFor(query){
    var q = String(query || '').trim().toLowerCase();
    if(!q) return '';
    if(/(?:\b(?:gb|gbz|aq|hj|tsg|hg|sh|iso|iec|nfpa|api|cfr)\s*[/t-]?\s*\d|\d{2,4}\/\d{2,4}\/e[cu]|主席令|国务院令|部令)/i.test(q)) return 'document-number';
    if(/有限空间|受限空间|confined/.test(q)) return 'confined-space';
    if(/动火|焊接|切割|hot\s*work|welding/.test(q)) return 'hot-work';
    if(/上锁|挂牌|loto|危险能量|energy\s*control/.test(q)) return 'loto-energy';
    if(/高处|高空|work\s*at\s*height|fall\s*protection/.test(q)) return 'work-at-height';
    if(/危化|危险化学|hazardous\s*chemical/.test(q)) return 'hazardous-chemicals';
    if(/重大危险源|major\s*hazard/.test(q)) return 'major-hazard';
    if(/重大事故隐患|重大隐患/.test(q)) return 'major-accident-hazard';
    if(/承包商|外包|contractor/.test(q)) return 'contractor';
    if(/机械|机器防护|machine|machinery/.test(q)) return 'machinery';
    if(/电气|临时用电|触电|electrical|electricity/.test(q)) return 'electrical';
    if(/消防|火灾|爆炸|防爆|fire|explosion|atex/.test(q)) return 'fire-explosion';
    if(/职业病|职业健康|职业卫生|接触限值|occupational\s*health/.test(q)) return 'occupational-health';
    if(/噪声|noise/.test(q)) return 'noise';
    if(/危险废物|危废|hazardous\s*waste/.test(q)) return 'hazardous-waste';
    if(/废水|污水|废气|排放|vocs?|emission|wastewater/.test(q)) return 'water-air-emissions';
    if(/应急|预案|救援|emergency/.test(q)) return 'emergency';
    if(/事故调查|事故报告|根因|incident|accident|riddor/.test(q)) return 'accident-investigation';
    if(/个体防护|个人防护|劳保|ppe/.test(q)) return 'ppe';
    if(/运输|道路|危险货物|transport|adr/.test(q)) return 'transport';
    if(/压力容器|锅炉|起重|叉车|特种设备|lifting|pressure|forklift/.test(q)) return 'pressure-lifting';
    if(/化学品|sds|msds|reach|clp|coshh/.test(q)) return 'chemical-management';
    return 'other-ehs';
}

function trackRegulationSearch(){
    var normalized = currentQuery.trim().toLowerCase();
    if(normalized.length < 2 || normalized === lastTrackedRegulationSearch || !window.EhsSilAnalytics) return;
    lastTrackedRegulationSearch = normalized;
    var count = getFilteredData(false).length;
    var context = {contentId:'query-' + queryCategoryFor(normalized), toolId:'regulation-search', pageType:'regulation_search', sourceChannel:'site', resultBucket:resultBucket(count)};
    window.EhsSilAnalytics.track('search_submit', context);
    if(!count) window.EhsSilAnalytics.track('search_no_result', context);
}

function setTab(tab, btn){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    btn.classList.add('active');
    currentTab = tab;
    filterRegs();
}

function filterRegs(){
    currentQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    render();
    clearTimeout(regulationAnalyticsTimer);
    regulationAnalyticsTimer = setTimeout(trackRegulationSearch, 800);
}

function matchesTab(r){
    if(currentTab === 'all') return true;
    if(currentTab === '国际标准') return r.sourceCategory === '版权标准' || r.sourceCategory === '国际指南';
    return (r.jurisdiction || r.c) === currentTab;
}


function downloadReg(r){
    if(window.EhsSilAnalytics) window.EhsSilAnalytics.track('export_click', {toolId:'regulation-search', pageType:'regulation_search', sourceChannel:'site'});
    var bom = '\uFEFF';
    var csv = bom + '法规名称,英文名称,标准编号,发布机构,年份,类型,分类,国家/地区,来源类别,下载政策,官方链接\n' +
        '"' + r.cn.replace(/"/g,'""') + '","' + r.en.replace(/"/g,'""') + '","' + (r.num||'').replace(/"/g,'""') + '","' + (r.auth||'').replace(/"/g,'""') + '",' + (r.yr||'') + ',"' + (r.type||'').replace(/"/g,'""') + '","' + (r.cat||'').replace(/"/g,'""') + '","' + (r.jurisdiction||r.c||'').replace(/"/g,'""') + '","' + (r.sourceCategory||'').replace(/"/g,'""') + '","' + (r.downloadPolicy||'').replace(/"/g,'""') + '","' + (r.officialSourceUrl||r.link||'').replace(/"/g,'""') + '"';
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = (r.num || r.cn) + '.csv';
    a.click(); URL.revokeObjectURL(url);
}
function downloadRegByIndex(index){ downloadReg(data[index]); }

function render(){
    var results = data;
    if(currentTab !== 'all') results = results.filter(matchesTab);
    if(currentQuery) results = results.filter(function(r){
        var c = (r.cn + ' ' + r.en + ' ' + r.num + ' ' + r.cat + ' ' + r.auth + ' ' + (r.jurisdiction||'') + ' ' + (r.sourceCategory||'')).toLowerCase();
        return c.indexOf(currentQuery) !== -1;
    });
    document.getElementById('count').textContent = results.length + ' / ' + data.length + ' 条法规';
    document.getElementById('list').innerHTML = results.map(function(r, idx){
        var jurisdiction = r.jurisdiction || r.c || '待分类';
        var tag = jurisdiction === '中国' ? '<span class="tag tag-cn">中国</span>' : '<span class="tag tag-intl">' + jurisdiction + '</span>';
        var typeTag = '';
        if(r.type.indexOf('法') !== -1) typeTag = '<span class="tag tag-law">' + r.type + '</span>';
        else if(r.type.indexOf('标准') !== -1) typeTag = '<span class="tag tag-standard">' + r.type + '</span>';
        var policyLabel = r.downloadPolicy === 'official_purchase_or_read' ? '版权标准·官方阅读/购买' : (r.downloadPolicy === 'official_download' ? '开放许可·官方下载' : '官方来源');
        var policyTag = '<span class="tag tag-policy">' + policyLabel + '</span>';
        var dl = '<button class="dl-btn" onclick="downloadRegByIndex(' + data.indexOf(r) + ')">&#128203; CSV</button>';
        var linkBtn = '';
        var officialUrl = r.officialSourceUrl || r.link;
        var sourceLabel = r.downloadPolicy === 'official_purchase_or_read' ? '官方阅读/购买' : '查看官方原文';
        if (officialUrl) linkBtn = ' <a class="dl-btn source-result-link" href="' + officialUrl + '" target="_blank" rel="noopener" style="text-decoration:none;background:#1d4ed8;margin-left:.2rem">&#128279; ' + sourceLabel + '</a>';
        if (r.officialDownloadUrl) linkBtn += ' <a class="dl-btn official-download-link" href="' + r.officialDownloadUrl + '" target="_blank" rel="noopener" style="text-decoration:none;background:#166534;margin-left:.2rem">&#11015; 官方下载</a>';
        var year = r.yr ? '<span>' + r.yr + '年</span>' : '';
        return '<div class="item"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><h3>' + r.cn + '</h3><div class="meta">' + tag + typeTag + policyTag + '<span>' + r.num + '</span><span>' + r.auth + '</span>' + year + '</div><div class="desc">' + r.en + '</div></div><div style="flex-shrink:0;margin-left:.5rem;white-space:nowrap">' + dl + linkBtn + '</div></div></div>';
    }).join('');
}
function getFilteredData(all) {
    if (all) return data;
    var results = data;
    if(currentTab !== 'all') results = results.filter(matchesTab);
    if(currentQuery) results = results.filter(function(r){
        var c = (r.cn + ' ' + r.en + ' ' + r.num + ' ' + r.cat + ' ' + r.auth + ' ' + (r.jurisdiction||'') + ' ' + (r.sourceCategory||'')).toLowerCase();
        return c.indexOf(currentQuery) !== -1;
    });
    return results;
}

function exportCSV(all) {
    var items = getFilteredData(all);
    if (!items.length) { alert('暂无数据可导出'); return; }
    if(window.EhsSilAnalytics) window.EhsSilAnalytics.track('export_click', {toolId:'regulation-search', pageType:'regulation_search', sourceChannel:'site', resultBucket:resultBucket(items.length)});
    var bom = '\uFEFF';
    var rows = [['法规名称','英文名称','标准编号','发布机构','年份','类型','分类','国家/地区','来源类别','下载政策','官方链接']];
    items.forEach(function(r){
        rows.push([r.cn,r.en||'',r.num||'',r.auth||'',r.yr||'',r.type||'',r.cat||'',r.jurisdiction||r.c||'',r.sourceCategory||'',r.downloadPolicy||'',r.officialSourceUrl||r.link||'']);
    });
    var csv = bom + rows.map(function(r){return r.map(function(c){return '"'+(c||'').toString().replace(/"/g,'""')+'"'}).join(',')}).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'EHS法规_' + (all ? '全部' : '筛选结果') + '_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
}

document.addEventListener('click', function(event){
    var link = event.target.closest('a');
    if(!link || !window.EhsSilAnalytics) return;
    if(link.classList.contains('source-result-link')) {
        window.EhsSilAnalytics.track('search_result_click', {toolId:'regulation-search', pageType:'regulation_search', sourceChannel:'site'});
    } else if(link.classList.contains('official-download-link')) {
        window.EhsSilAnalytics.track('export_click', {toolId:'regulation-official-download', pageType:'regulation_search', sourceChannel:'site'});
    } else if(link.href.indexOf('compliance-identification.html') !== -1) {
        window.EhsSilAnalytics.track('content_to_tool', {toolId:'compliance-identification', pageType:'regulation_search', sourceChannel:'site'});
    }
});

</script>

<footer style="text-align:center;padding:2rem;font-size:.78rem;color:var(--text-muted);border-top:1px solid var(--border)">
    <p>&copy; 2026 EHS-SIL &middot; 法规仅供参考，请以官方正式文本为准</p>
</footer>
</body>
